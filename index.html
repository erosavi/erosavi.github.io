<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine's Card</title>
  </head>
  <body>
    <div class="card">
	<div class="card__content">
		<p>
			Press the red button,<br>
			Let our love play.<br>
			Since first sweet glance, <br>
      		You were the one.
		</p>

		<p>
			Through every sunrise, <br>
			Through every night, <br>
			  Still my joy,<br>
    Still my heart’s delight.
		</p>

		<p>
    Loved you then,<br>
   Love you still.<br>
    Forever intertwined,<br>
    Our hearts entwined.
</p>
    <p>
    Happy Valentine’s, baby!❤️<br>
    <br>
    — E.V 😎
	</p>
	</div>

	<fieldset class="card__color-picker">
		<legend>Select a color:</legend>

		<input type="radio" id="red" name="color" value="red" />
		<label for="red">Red</label>

		<input type="radio" id="blue" name="color" value="blue" />
		<label for="blue">Blue</label>

		<input type="radio" id="green" name="color" value="green" />
		<label for="green">Green</label>

		<input type="radio" id="yellow" name="color" value="yellow" />
		<label for="yellow">Yellow</label>

		<input type="radio" id="orange" name="color" value="orange" />
		<label for="orange">Orange</label>
	</fieldset>
	<div>

		<div class="hearts">
			<div class="heart heart--is-yellow heart--top-left"></div>
			<div class="heart heart--with-dots heart--is-green heart--left-center"></div>
			<div class="heart heart--with-dots heart--is-red heart--top-center"></div>
			<div class="heart heart--is-pink heart--bottom-center"></div>
			<div class="heart heart--is-orange heart--bottom-right"></div>
			<div class="heart heart--is-blue heart--with-lines heart--top-right"></div>
		</div>
<audio id="redSound" src="herewithme1.mp3" display></audio>
<audio id="blueSound" src="herewithme2.mp3"></audio>
<audio id="greenSound" src="herewithme3.mp3"></audio>
<audio id="yellowSound" src="herewithme4.mp3"></audio>
<audio id="orangeSound" src="herewithme5.mp3"></audio>
<script src="script.js"></script>
  </body>
</html>
